<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>McAuley for Congress</title>

<style>
:root{
  --red:#e10600;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
}

html, body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Tahoma, Arial, sans-serif;
}

body{
  background:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--white);
}

.screen{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  padding:20px;
}

/* MAIN LOGO */
.logo{
  text-transform:uppercase;
  line-height:.95;
}

.logo-main{
  font-size:clamp(58px, 11vw, 150px);
  font-weight:900;
  letter-spacing:-3px;
  margin:0;
  text-shadow:
    0 6px 18px rgba(0,0,0,.18);
}

.logo-sub{
  margin-top:18px;
  font-size:clamp(24px, 4vw, 58px);
  font-weight:800;
  letter-spacing:1px;
}

/* COMING SOON */
.coming{
  margin-top:55px;
  font-size:clamp(20px, 2vw, 34px);
  font-weight:700;
  opacity:.92;
  letter-spacing:.5px;
}

.dots span{
  animation:blink 1.4s infinite;
}

.dots span:nth-child(2){
  animation-delay:.2s;
}

.dots span:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%{
    opacity:.15;
  }
  20%{
    opacity:1;
  }
  100%{
    opacity:.15;
  }
}

/* FOOTER DISCLAIMER */
footer{
  position:absolute;
  bottom:38px;
  left:50%;
  transform:translateX(-50%);
  border:1.5px solid rgba(255,255,255,.75);
  padding:8px 14px;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  color:white;
  background:transparent;
}

@media(max-width:600px){

  .logo-main{
    letter-spacing:-1px;
  }

  footer{
    font-size:11px;
    bottom:24px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <div class="logo">
    <div class="logo-main">McAuley</div>
    <div class="logo-sub">FOR CONGRESS</div>
  </div>

  <div class="coming">
    Coming Soon
    <span class="dots">
      <span>.</span><span>.</span><span>.</span>
    </span>
  </div>

  <footer>
    Paid for by McAuley for Congress
  </footer>

</div>

</body>
</html>
