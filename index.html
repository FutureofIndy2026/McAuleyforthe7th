<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>McAuley for Congress</title>

<style>
:root{
  --red:#e10600;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  overflow:hidden;

  font-family:"Tahoma", Arial, sans-serif;

  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

body{
  background:var(--red);

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--white);
}

/* MAIN SCREEN */
.screen{
  width:100%;
  min-height:100svh;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  position:relative;

  padding:
    max(20px, env(safe-area-inset-top))
    20px
    160px
    20px;
}

/* LOGO */
.logo{
  text-transform:uppercase;
  line-height:.95;
}

.logo-main{
  margin:0;

  font-family:"Tahoma", Arial, sans-serif;
  font-size:clamp(56px, 12vw, 150px);
  font-weight:900;
  letter-spacing:-3px;

  color:#ffffff;

  text-shadow:
    0 6px 18px rgba(0,0,0,.18);
}

.logo-sub{
  margin-top:18px;

  font-family:"Tahoma", Arial, sans-serif;
  font-size:clamp(24px, 4vw, 58px);
  font-weight:800;
  letter-spacing:1px;

  color:#ffffff;

  text-shadow:
    0 4px 14px rgba(0,0,0,.12);
}

/* COMING SOON */
.coming{
  margin-top:60px;

  font-family:"Tahoma", Arial, sans-serif;
  font-size:clamp(20px, 3vw, 34px);
  font-weight:700;

  color:#ffffff;

  opacity:1;

  letter-spacing:0px;
  line-height:1.1;

  text-shadow:
    0 4px 14px rgba(0,0,0,.15);

  -webkit-font-smoothing:antialiased;
}

/* BLINKING DOTS */
.dots span{
  animation:blink 1.4s infinite;
}

.dots span:nth-child(2){
  animation-delay:.2s;
}

.dots span:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%{
    opacity:.15;
  }

  20%{
    opacity:1;
  }

  100%{
    opacity:.15;
  }
}

/* FOOTER */
footer{
  position:fixed;

  left:50%;
  bottom:calc(18px + env(safe-area-inset-bottom));

  transform:translateX(-50%);

  font-family:"Tahoma", Arial, sans-serif;
  font-size:12px;
  font-weight:700;

  color:#ffffff;

  border:1.5px solid rgba(255,255,255,.78);

  padding:8px 12px;

  background:var(--red);

  white-space:nowrap;

  z-index:9999;

  max-width:94vw;
}

/* MOBILE OPTIMIZATION */
@media(max-width:600px){

  .screen{
    min-height:100dvh;
    justify-content:center;
    padding-bottom:170px;
  }

  .logo-main{
    font-size:clamp(54px, 16vw, 92px);
    letter-spacing:-1px;
  }

  .logo-sub{
    font-size:clamp(22px, 7vw, 36px);
    margin-top:12px;
  }

  .coming{
    margin-top:52px;

    font-size:22px;

    letter-spacing:0px;

    line-height:1.15;

    transform:translateX(1px);

    color:#ffffff;
  }

  footer{
    font-size:10px;

    padding:7px 10px;

    bottom:calc(14px + env(safe-area-inset-bottom));
  }
}

/* EXTRA SMALL PHONES */
@media(max-width:380px){

  .logo-main{
    font-size:48px;
  }

  .logo-sub{
    font-size:20px;
  }

  .coming{
    font-size:18px;
  }

  footer{
    font-size:9px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <div class="logo">
    <div class="logo-main">McAuley</div>
    <div class="logo-sub">FOR CONGRESS</div>
  </div>

  <div class="coming">
    Coming Soon
    <span class="dots">
      <span>.</span><span>.</span><span>.</span>
    </span>
  </div>

  <footer>
    Paid for by McAuley for Congress
  </footer>

</div>

</body>
</html>
