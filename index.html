<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>

<title>McAuley for Congress</title>

<style>
:root{
  --red:#e10600;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  height:100%;
}

body{
  margin:0;
  min-height:100svh;
  width:100%;
  overflow:hidden;
  background:var(--red);
  color:var(--white);
  font-family:Tahoma, Arial, sans-serif;

  display:flex;
  align-items:center;
  justify-content:center;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* MAIN CONTAINER */
.screen{
  width:100%;
  min-height:100svh;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
  position:relative;

  padding:
    max(20px, env(safe-area-inset-top))
    20px
    max(115px, env(safe-area-inset-bottom))
    20px;
}

/* LOGO */
.logo{
  text-transform:uppercase;
  line-height:.88;
}

.logo-main{
  margin:0;

  font-family:Tahoma, Arial, sans-serif;
  font-size:clamp(72px, 16vw, 175px);
  font-weight:900;
  letter-spacing:-4px;

  color:#ffffff;

  text-shadow:
    0 4px 12px rgba(0,0,0,.10);
}

.logo-sub{
  margin-top:18px;

  font-family:Tahoma, Arial, sans-serif;
  font-size:clamp(30px, 5vw, 62px);
  font-weight:900;
  letter-spacing:-1px;

  color:#ffffff;

  text-shadow:
    0 3px 10px rgba(0,0,0,.10);
}

/* COMING SOON */
.coming{
  margin-top:80px;

  font-family:Tahoma, Arial, sans-serif;
  font-size:clamp(20px, 4vw, 34px);
  font-weight:700;
  letter-spacing:.5px;

  color:#ffffff;

  text-shadow:
    0 4px 14px rgba(0,0,0,.15);
}

/* BLINKING DOTS */
.dots span{
  animation:blink 1.4s infinite;
}

.dots span:nth-child(2){
  animation-delay:.2s;
}

.dots span:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%{
    opacity:.15;
  }

  20%{
    opacity:1;
  }

  100%{
    opacity:.15;
  }
}

/* FOOTER */
footer{
  position:absolute;

  left:50%;
  bottom:calc(22px + env(safe-area-inset-bottom));

  transform:translateX(-50%);

  font-family:Tahoma, Arial, sans-serif;
  font-size:13px;
  font-weight:700;

  color:#ffffff;

  border:1.5px solid rgba(255,255,255,.92);

  padding:9px 14px;

  background:transparent;

  white-space:nowrap;

  max-width:92%;
}

/* MOBILE */
@media(max-width:600px){

  .screen{
    padding-bottom:130px;
  }

  .logo-main{
    font-size:clamp(68px, 20vw, 105px);
    letter-spacing:-2px;
  }

  .logo-sub{
    margin-top:12px;
    font-size:clamp(28px, 8vw, 42px);
  }

  .coming{
    margin-top:58px;
    font-size:22px;
  }

  footer{
    font-size:11px;
    padding:8px 12px;
    bottom:calc(20px + env(safe-area-inset-bottom));
  }
}

/* EXTRA SMALL DEVICES */
@media(max-width:380px){

  .logo-main{
    font-size:58px;
  }

  .logo-sub{
    font-size:24px;
  }

  .coming{
    font-size:18px;
  }

  footer{
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <div class="logo">
    <div class="logo-main">McAuley</div>
    <div class="logo-sub">FOR CONGRESS</div>
  </div>

  <div class="coming">
    Coming Soon
    <span class="dots">
      <span>.</span><span>.</span><span>.</span>
    </span>
  </div>

  <footer>
    Paid for by McAuley for Congress
  </footer>

</div>

</body>
</html>
